# Questions with a broad, well-documented consensus in the literature. The run should
# answer, cite retrieved sources, and find supporting evidence.
- id: settled-001
  question: Does dropout reduce overfitting in neural networks?
  category: settled
  expect:
    status_any: [answered]
    min_sources: 2
    min_claims: 2
    stances_any: [supports]
    answer_contains_any: [dropout, overfit]

