server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Static health endpoint for the container health check.
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Backend API. Using the Compose service name keeps the browser same-origin,
    # which avoids CORS and never exposes the backend port to the outside.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pipeline runs can take a few minutes on the free tier.
        proxy_read_timeout 300s;
    }

    location = /health { proxy_pass http://backend:8000/health; }
    location = /ready  { proxy_pass http://backend:8000/ready; }

    # Interactive API documentation, linked from the UI.
    location = /docs         { proxy_pass http://backend:8000/docs; }
    location = /openapi.json { proxy_pass http://backend:8000/openapi.json; }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
