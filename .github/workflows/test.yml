name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.7.4
      - run: ruff check backend database
      - run: ruff format --check backend database

  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: backend

  migrate-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r database/requirements.txt
      - run: python -m pytest -q
        working-directory: database

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  # Full stack smoke test: migrations, readiness, status, metrics, request ids.
  integration:
    runs-on: ubuntu-latest
    needs: [backend-unit, migrate-unit]
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        env:
          LLM_PROVIDER: mock
        run: docker compose up --build -d --wait --wait-timeout 300
      - name: Readiness
        run: curl -fsS http://localhost:8100/ready
      - name: System status reports the migrated schema
        run: curl -fsS http://localhost:8100/api/v1/system/status | grep -q '"schema_version":"0001_core"'
      - name: Observability smoke test
        run: |
          curl -fsS http://localhost:8100/metrics | grep -q argumind_http_requests_total
          test -n "$(curl -fsS -D - -o /dev/null http://localhost:8100/health | grep -i x-request-id)"
      - name: Source search validates input without touching the network
        run: test "$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:8100/api/v1/sources/search?q=ab')" = "422"
      - name: Frontend serves the app and proxies the API
        run: |
          curl -fsS http://localhost:3100/ | grep -q '<div id="root">'
          curl -fsS http://localhost:3100/api/v1/system/status | grep -q '"service":"ArguMind"'
      - name: Migration job is idempotent
        run: docker compose run --rm db-migrate | grep -q "nothing to apply"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - run: docker compose down -v
        if: always()
